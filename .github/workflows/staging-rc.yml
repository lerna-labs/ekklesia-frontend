name: Staging release candidate

# On every push to staging, build the preprod and preprod-intersect bundles, one
# per environment, and attach both to the rolling "preprod" prerelease that the
# preprod servers pull their assets from. The RC version is a Changesets
# snapshot (X.Y.Z-rc-<timestamp>) computed from the pending changesets; nothing
# is committed to staging and the changeset files stay intact for the real
# release on main.
#
# Also keeps a single open staging -> main promotion PR alive.
on:
  push:
    branches: [staging]

concurrency:
  group: staging-rc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    # Skip the RC build entirely when staging already matches the released main
    # (nothing unreleased to preview — e.g. right after a release backport).
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.g.outputs.build }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.commit.tree.sha')
          head_tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/staging" --jq '.commit.tree.sha')
          if [ "$main_tree" = "$head_tree" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "staging matches the released main; nothing unreleased to preview."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  rc-artifact:
    name: rc-artifact (${{ matrix.environment }})
    environment: ${{ matrix.environment }}
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - environment: preprod
            asset: ekklesia-frontend-preprod.tgz
          - environment: preprod-intersect
            asset: ekklesia-frontend-preprod-intersect.tgz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17
          cache: npm

      - run: npm ci

      - name: Compute snapshot RC version
        id: rc
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | head -1)
          if [ -n "$pending" ]; then
            npx changeset version --snapshot rc
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            # Discard the snapshot bump; nothing is committed to staging and the
            # changeset files must stay intact for the real release on main.
            git checkout -- .
          else
            echo "version=$(node -p "require('./package.json').version")-staging" >> "$GITHUB_OUTPUT"
            echo "No pending changesets; building a plain staging preview."
          fi

      - name: Check frontend build variables
        env:
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
        run: |
          if [ -z "$VITE_APP_URL" ]; then
            echo "::error::Missing required frontend variable in the '${{ matrix.environment }}' environment: VITE_APP_URL"
            exit 1
          fi

      - name: Build (${{ matrix.environment }})
        # A variable unset in the environment arrives as an empty string, which
        # branding.js, brand-build-output.js and content.js treat as unset, so
        # their defaults stay in force.
        env:
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE }}
          VITE_APP_DESCRIPTION: ${{ vars.VITE_APP_DESCRIPTION }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_APP_OG_IMAGE: ${{ vars.VITE_APP_OG_IMAGE }}
          VITE_APP_TWITTER_HANDLE: ${{ vars.VITE_APP_TWITTER_HANDLE }}
          VITE_APP_CONTENT: ${{ vars.VITE_APP_CONTENT }}
        run: npm run build:preprod

      - name: Package tarball
        run: |
          # Stable asset names so the preprod servers always pull the same URLs:
          # releases/download/preprod/<asset>
          mkdir -p dist-rc
          tar -czf "dist-rc/${{ matrix.asset }}" -C build/preprod . -C "$GITHUB_WORKSPACE" LICENSE
          echo "${{ steps.rc.outputs.version }}" > dist-rc/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rc-${{ matrix.environment }}
          path: dist-rc
          if-no-files-found: error
          retention-days: 1

  publish-rc:
    # A single job owns the rolling release so the per-flavor builds cannot
    # delete each other's assets.
    needs: rc-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rc-*
          path: dist-rc

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_MANAGER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_MANAGER_APP_PRIVATE_KEY }}

      - name: Publish rolling preprod prerelease
        # The rolling release is tagged `preprod`, NOT `staging` — a tag named
        # `staging` would collide with the staging branch and break ref
        # resolution for promotion/backport PRs targeting the branch.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version=$(cat dist-rc/rc-preprod/version.txt)
          gh release delete preprod --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create preprod --repo "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Preprod preview ($version)" \
            --notes "Rolling preprod build of staging. Version $version. Download an asset, extract, and serve as static files." \
            dist-rc/rc-preprod/ekklesia-frontend-preprod.tgz \
            dist-rc/rc-preprod-intersect/ekklesia-frontend-preprod-intersect.tgz

  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_MANAGER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_MANAGER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or refresh the staging -> main promotion PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base_tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.commit.tree.sha')
          head_tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/staging" --jq '.commit.tree.sha')
          if [ "$base_tree" = "$head_tree" ]; then
            echo "staging and main have identical trees; nothing to promote."
            exit 0
          fi
          node .github/scripts/promotion-body.mjs main > pr-body.md
          num=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head staging --state open --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            jq -Rs '{body: .}' pr-body.md | gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$num" --input - >/dev/null
            echo "Refreshed promotion PR #$num body."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head staging \
              --title "Promote staging to main" --body-file pr-body.md --label promotion
          fi
